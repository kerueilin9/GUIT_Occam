# AgentOccam-ISP – Input Space Partitioning testing mode
#
# Usage:
#   python eval_webarena.py --config AgentOccam/configs/AgentOccam-ISP.yml
#
# The agent will:
#   1. Run a discovery pass to collect all "type" actions.
#   2. Generate ISP partitions (valid / boundary / invalid / empty) for each
#      discovered input field using the configured LLM.
#   3. Execute one run per partition-combination, resetting the browser each
#      time.
#   4. Write a JSON test report to <isp.output_dir>/<task_id>_isp_report.json
#
logging: True
verbose: 1
debug: False
logdir: "../AgentOccam-Trajectories"
logname: "AgentOccam-ISP"
max_steps: 20
agent:
  type: "AgentOccam"
  others:
    max_steps: 20
    logname: "AgentOccam-ISP"
    logging: True
    verbose: 1
    debug: False
  # ── ISP-specific settings ──────────────────────────────────────────────────
  isp:
    enabled: true
    # Maximum ISP partition values to generate per input field.
    max_partitions_per_field: 5
    # At most this many fields are included in the cartesian product.
    # (3 fields × 5 partitions = 125 combinations maximum.)
    max_fields: 3
    # Directory for the JSON test reports.
    output_dir: "output/isp_results"
    # LLM used to generate partition values.  Defaults to actor.model when
    # omitted.
    isp_model: "adk-gemini-2.5-flash"
  # ── standard actor / critic / judge ───────────────────────────────────────
  actor:
    debug: 0
    verbose: 1
    number: 1
    model: "adk-gemini-2.5-flash"
    documented_interaction_elements:
      [
        "url",
        "plan",
        "reason",
        "observation summary",
        "retained element ids",
        "observation highlight",
      ]
    online_interaction_elements: []
    input:
      [
        "step",
        "objective",
        "previous plans",
        "interaction history",
        "current observation",
      ]
    interaction_history:
      verbose: True
      type: ["text"]
      step_num: 3
    current_observation:
      type: ["text"]
    output:
      [
        "interaction history summary",
        "observation description",
        "reason",
        "action",
        "observation highlight",
      ]
    planning_command: ["branch", "prune"]
    navigation_command: ["click", "type", "stop", "note", "go_back"]
    play:
      [
        "step",
        "objective",
        "previous plans",
        "observation description",
        "reason",
        "action",
      ]
    trash:
      ["objective", "step", "url", "instruction", "online input", "response"]
  critic:
    mode: false
    debug: 0
    verbose: 1
    model: "adk-gemini-2.5-flash"
    documented_interaction_elements: []
    online_interaction_elements: []
    character: "normal"
    input:
      [
        "objective",
        "previous plans",
        "interaction history",
        "step",
        "current observation",
      ]
    interaction_history:
      verbose: True
      type: ["text"]
      step_num: "all"
    current_observation:
      type: ["text"]
    output: ["observation description", "mistakes"]
    trash: ["instruction", "online input", "response"]
  judge:
    mode: false
    debug: 0
    verbose: 1
    model: "adk-gemini-2.5-flash"
    documented_interaction_elements: []
    online_interaction_elements: []
    strict: false
    input:
      [
        "objective",
        "previous plans",
        "interaction history",
        "step",
        "current observation",
        "action choices",
      ]
    interaction_history:
      verbose: True
      type: ["text"]
      step_num: "all"
    current_observation:
      type: ["text"]
    output:
      ["plan progress assessment", "action assessment", "action selection"]
    trash: ["instruction", "online input", "response"]
env:
  fullpage: true
  prune: true
  max_browser_rows: 500
  headless: False
  relative_task_dir: "keystonejs"
  task_ids:
    - "task_post01"
  max_env_steps: 20
